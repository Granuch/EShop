# Redis browsers from compose's "tools" profile. Neither has its own login, so they must never be exposed
# beyond the LAN.
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  labels:
    app.kubernetes.io/name: redis-insight
    app.kubernetes.io/component: tools
spec:
  selector:
    app.kubernetes.io/name: redis-insight
  ports:
    - name: http
      port: 5540
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
  labels:
    app.kubernetes.io/name: redis-insight
    app.kubernetes.io/component: tools
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-insight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-insight
        app.kubernetes.io/component: tools
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        # Fix ownership only on a new volume: re-applied on every start, it gives files group write
        # (RabbitMQ then refuses its .erlang.cookie, PostgreSQL its data directory).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-insight
          image: redis/redisinsight:2.58
          env:
            - name: RI_APP_HOST
              value: 0.0.0.0
            - name: RI_APP_PORT
              value: "5540"
          ports:
            - name: http
              containerPort: 5540
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-insight-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-insight-data
  labels:
    app.kubernetes.io/name: redis-insight
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-commander
  labels:
    app.kubernetes.io/name: redis-commander
    app.kubernetes.io/component: tools
spec:
  selector:
    app.kubernetes.io/name: redis-commander
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-commander
  labels:
    app.kubernetes.io/name: redis-commander
    app.kubernetes.io/component: tools
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-commander
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-commander
        app.kubernetes.io/component: tools
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis-commander
          image: rediscommander/redis-commander:latest@sha256:19cd0c49f418779fa2822a0496c5e6516d0c792effc39ed20089e6268477e40a
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: redis-password
            - name: REDIS_HOSTS
              value: local:redis:6379:0:$(REDIS_PASSWORD)
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

# Prometheus exporters for the five databases and Redis (compose profile "monitoring"). The service names
# are the scrape targets in infrastructure/prometheus/prometheus.yml.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter-identity
  labels:
    app.kubernetes.io/name: postgres-exporter-identity
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter-identity
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter-identity
  labels:
    app.kubernetes.io/name: postgres-exporter-identity
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter-identity
        app.kubernetes.io/component: monitoring
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: prometheuscommunity/postgres-exporter:v0.16.0
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: identity-db-password
            - name: DATA_SOURCE_NAME
              value: postgresql://postgres:$(DB_PASSWORD)@identity-postgres:5432/eshop_identity?sslmode=disable
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---

# One PostgreSQL 16 per service, as in docker-compose.yml. The five blocks differ only in name, database and
# tuning file; change all five together (the root CLAUDE.md warns that near-identical manifests drift).
# Data lives in a local-path volume on the node. PGDATA is a subdirectory so the volume root may hold
# other files without initdb refusing a non-empty directory.
---
apiVersion: v1
kind: Service
metadata:
  name: identity-postgres
  labels:
    app.kubernetes.io/name: identity-postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: identity-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identity-postgres
  labels:
    app.kubernetes.io/name: identity-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: identity-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      # A clean shutdown writes a checkpoint; give it time before SIGKILL.
      terminationGracePeriodSeconds: 60
      # The image's postgres user (uid 70) from the start: the entrypoint then skips its root-to-postgres switch
      # (gosu), and the container needs no capabilities.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        # Fix ownership only on a new volume: re-applied on every start, it gives files group write
        # (RabbitMQ then refuses its .erlang.cookie, PostgreSQL its data directory).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.16-alpine
          args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
          env:
            - name: POSTGRES_DB
              value: eshop_identity
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: identity-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "eshop_identity"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "eshop_identity"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # shared_buffers is 256MB in the tuning file.
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: postgres-config-identity
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---

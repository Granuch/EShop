# API gateway (YARP). Reachable only inside the cluster: the public path is ingress -> ui -> api-gateway.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Start the new pod before stopping the old one, so a rollout never leaves the component without a pod.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # appuser in every service image (USER 999:999).
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # Fix ownership only on a new volume: re-applied on every start, it gives files group write
        # (RabbitMQ then refuses its .erlang.cookie, PostgreSQL its data directory).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/granuch/eshop-api-gateway
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eshop-config
            - configMapRef:
                name: gateway-config
          env:
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: jwt-secret-key
            - name: Email__Username
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: smtp-username
            - name: Email__Password
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: smtp-password
            - name: Email__From
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: smtp-from-email
            - name: Gateway__OperationsEmailRecipients__0
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: smtp-from-email
          # Start-up applies EF migrations before the host listens, so allow up to five minutes.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          # /health/ready checks Redis, whose client waits up to 5 s per attempt (connectTimeout=5000), so a
          # 1 s timeout would report a Redis outage as a probe timeout rather than a 503 (docker-ci DC-46).
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              memory: 448Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        # The rolling file sink; Seq holds the searchable copy.
        - name: logs
          emptyDir:
            sizeLimit: 256Mi

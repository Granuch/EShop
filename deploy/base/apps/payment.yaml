# Payment: Stripe test-mode payments. Owns payment-postgres; Stripe webhooks arrive from the stripe-listener in the server overlay.
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: payment-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels:
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Start the new pod before stopping the old one, so a rollout never leaves the component without a pod.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-api
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # appuser in every service image (USER 999:999).
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-api
          image: ghcr.io/granuch/eshop-payment-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eshop-config
            - configMapRef:
                name: payment-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: payment-db-password
            - name: ConnectionStrings__PaymentDb
              value: "Host=payment-postgres;Port=5432;Database=eshop_payment;Username=postgres;Password=$(DB_PASSWORD);MaxPoolSize=40;Timeout=30;Command Timeout=30"
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: rabbitmq-username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: rabbitmq-password
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: jwt-secret-key
            - name: Stripe__SecretKey
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: stripe-secret-key
            - name: Stripe__PublishableKey
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: stripe-publishable-key
            - name: Stripe__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: stripe-webhook-secret
          # Start-up applies EF migrations before the host listens, so allow up to five minutes.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          # /health/ready checks Redis, whose client waits up to 5 s per attempt (connectTimeout=5000), so a
          # 1 s timeout would report a Redis outage as a probe timeout rather than a 503 (docker-ci DC-46).
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        # The rolling file sink; Seq holds the searchable copy.
        - name: logs
          emptyDir:
            sizeLimit: 256Mi

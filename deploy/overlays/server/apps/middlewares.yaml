# What nginx did on the PC, as Traefik middlewares (infrastructure/nginx/https.conf.template).
# Traefik drops a client-sent X-Forwarded-For and sets the visitor's own address, because no trusted proxy is
# configured; with externalTrafficPolicy Local (k3s HelmChartConfig) that address is the real one.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  # Leaves HTTPS requests alone. cert-manager's HTTP-01 challenge uses its own Ingress, so it is not redirected.
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
spec:
  buffering:
    # nginx's client_max_body_size 10m.
    maxRequestBodyBytes: 10485760

# Fixed ports for the operator UIs, on the server's own address. The router forwards only 80 and 443, so these
# answer on the home LAN and over Tailscale, never from the internet. Seq, Grafana and RabbitMQ ask for a
# password; Prometheus, Jaeger and the Redis tools have none, which is why none of them gets an Ingress.
#   Grafana 30300, Seq 30341, Jaeger 30686, Prometheus 30090, RabbitMQ 31672, RedisInsight 30540,
#   Redis Commander 30081
apiVersion: v1
kind: Service
metadata:
  name: grafana-lan
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: seq-lan
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: seq
  ports:
    - name: ui
      port: 80
      targetPort: ui
      nodePort: 30341
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-lan
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
      nodePort: 30686
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-lan
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-lan
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: management
      port: 15672
      targetPort: management
      nodePort: 31672
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight-lan
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redis-insight
  ports:
    - name: http
      port: 5540
      targetPort: http
      nodePort: 30540
---
apiVersion: v1
kind: Service
metadata:
  name: redis-commander-lan
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redis-commander
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081

# Stripe test-mode webhooks without a public webhook route: the Stripe CLI keeps an outbound connection to
# Stripe and forwards each event to payment-api inside the cluster, as compose's "stripe" profile does.
# STRIPE_WEBHOOK_SECRET (Secret key stripe-webhook-secret) must be the signing secret this listener prints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stripe-listener
  labels:
    app.kubernetes.io/name: stripe-listener
    app.kubernetes.io/component: edge
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Two listeners would deliver every event twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stripe-listener
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stripe-listener
        app.kubernetes.io/component: edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stripe-listener
          image: stripe/stripe-cli:v1.55.14
          args:
            - listen
            - --forward-to
            - http://payment-api:8080/webhooks/stripe
            - --events
            - payment_intent.created,payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,charge.succeeded,charge.failed,charge.updated
          env:
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: stripe-secret-key
            # The CLI writes its config under $HOME; the image's default home may not be writable for uid 1000.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

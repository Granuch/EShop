version: 2
updates:
  # NuGet. directory "/" is enough: the updater discovers every project in the repo and a grouped PR
  # spans all of them. The repo has no central package management, so a group must hold every package
  # that has to move in lockstep — otherwise one PR bumps half a family and restore fails with
  # NU1605/NU1107 (PR #76: AspNetCore.Identity.EntityFrameworkCore 10.0.12 needs EF Core 10.0.12,
  # which sat in a separate group). Dependabot assigns a package to the FIRST group that matches it.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    rebase-strategy: auto

    groups:
      # The .NET platform ships these on one version line (10.0.x); they reference each other with
      # minimum versions, so they only restore when bumped together.
      dotnet-platform:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Npgsql.EntityFrameworkCore*"
        update-types:
          - "minor"
          - "patch"

      # System.IdentityModel.Tokens.Jwt and Microsoft.IdentityModel.* are one family (8.x).
      identity-model:
        patterns:
          - "System.IdentityModel.*"
          - "Microsoft.IdentityModel.*"
        update-types:
          - "minor"
          - "patch"

      messaging:
        patterns:
          - "MassTransit*"
          - "RabbitMQ*"
        update-types:
          - "minor"
          - "patch"

      cqrs:
        patterns:
          - "MediatR*"
          - "FluentValidation*"
          - "Mapster*"
        update-types:
          - "minor"
          - "patch"

      # Pinned separately in seven projects; the exporter and the instrumentation packages must match.
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
        update-types:
          - "minor"
          - "patch"

      logging-metrics:
        patterns:
          - "Serilog*"
          - "prometheus-net*"
        update-types:
          - "minor"
          - "patch"

      health-checks:
        patterns:
          - "AspNetCore.HealthChecks.*"
        update-types:
          - "minor"
          - "patch"

      testing:
        patterns:
          - "NUnit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
          - "Moq"
          - "FluentAssertions"
          - "Testcontainers*"
        update-types:
          - "minor"
          - "patch"

      mail:
        patterns:
          - "MailKit"
          - "MimeKit"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions, one PR for all of them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    rebase-strategy: auto
    groups:
      actions:
        patterns:
          - "*"

  # Base images of the seven service Dockerfiles. Each lives beside its API project, not at the root —
  # with directory "/" the job failed with "No Dockerfiles nor Kubernetes YAML found in /".
  - package-ecosystem: "docker"
    directories:
      - "/src/ApiGateways/*"
      - "/src/Services/*/*.API"
      - "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
    rebase-strategy: auto
    groups:
      base-images:
        patterns:
          - "*"

  # Infrastructure images referenced by docker-compose.yml and its override files.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    rebase-strategy: auto

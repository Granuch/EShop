# ============================================================
# Mailpit — local SMTP catcher
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
      - name: mailpit
        image: axllent/mailpit:v1.27
        ports:
        - containerPort: 8025
          name: ui
        - containerPort: 1025
          name: smtp
        readinessProbe:
          httpGet:
            path: /
            port: 8025
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: eshop
spec:
  selector:
    app: mailpit
  ports:
  - port: 8025
    targetPort: 8025
    name: ui
  - port: 1025
    targetPort: 1025
    name: smtp

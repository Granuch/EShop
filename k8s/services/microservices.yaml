# ============================================================
# EShop Microservices — Deployments + ClusterIP Services
# Fix: connection strings берутся целиком из Secret (valueFrom),
#      не через $(VAR) интерполяцию которая не работает в k8s
# ============================================================

# ---- Identity API ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: eshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      containers:
      - name: identity-api
        image: eshop-identity-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: eshop-config
        env:
        - name: ConnectionStrings__IdentityDb
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: connstr-identity-db
        - name: ConnectionStrings__Redis
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: connstr-redis
        - name: RabbitMQ__Host
          value: "rabbitmq"
        - name: RabbitMQ__Port
          value: "5672"
        - name: RabbitMQ__Username
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: rabbitmq-username
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: rabbitmq-password
        - name: JwtSettings__SecretKey
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: jwt-secret-key
        - name: JwtSettings__Issuer
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: jwt-issuer
        - name: JwtSettings__Audience
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: jwt-audience
        - name: InternalServiceAuth__ApiKey
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: internal-service-api-key
        - name: InternalServiceAuth__HeaderName
          valueFrom:
            secretKeyRef:
              name: eshop-secrets
              key: internal-service-api-key-header
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: eshop
spec:
  selector:
    app: identity-api
  ports:
  - port: 8080
    targetPort: 8080


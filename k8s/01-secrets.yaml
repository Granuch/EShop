# ============================================================
# EShop Secrets
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: eshop-secrets
  namespace: eshop
type: Opaque
stringData:
  # ---- PostgreSQL passwords (raw) ----
  postgres-password: "postgres"
  postgres-user: "postgres"
  postgres-db: "eshop_identity"

  catalog-postgres-password: "postgres"
  catalog-postgres-user: "postgres"
  catalog-postgres-db: "eshop_catalog"

  ordering-postgres-password: "postgres"
  ordering-postgres-user: "postgres"
  ordering-postgres-db: "eshop_ordering"

  payment-postgres-password: "postgres"
  payment-postgres-user: "postgres"
  payment-postgres-db: "eshop_payment"

  notification-postgres-password: "postgres"
  notification-postgres-user: "postgres"
  notification-postgres-db: "eshop_notification"

  # ---- Ready-to-use connection strings (no interpolation needed) ----
  connstr-identity-db: "Host=postgres;Port=5432;Database=eshop_identity;Username=postgres;Password=postgres;MaxPoolSize=40;Timeout=30;Command Timeout=30"
  connstr-catalog-db: "Host=catalog-postgres;Port=5432;Database=eshop_catalog;Username=postgres;Password=postgres;MaxPoolSize=80;Timeout=30;Command Timeout=30"
  connstr-ordering-db: "Host=ordering-postgres;Port=5432;Database=eshop_ordering;Username=postgres;Password=postgres;MaxPoolSize=80;Timeout=30;Command Timeout=30"
  connstr-payment-db: "Host=payment-postgres;Port=5432;Database=eshop_payment;Username=postgres;Password=postgres;MaxPoolSize=40;Timeout=30;Command Timeout=30"
  connstr-notification-db: "Host=notification-postgres;Port=5432;Database=eshop_notification;Username=postgres;Password=postgres;MaxPoolSize=40;Timeout=30;Command Timeout=30"
  connstr-redis: "redis:6379,password=redis_secret,ssl=false,abortConnect=false,connectTimeout=5000,syncTimeout=5000,connectRetry=3"

  # ---- Redis ----
  redis-password: "redis_secret"

  # ---- RabbitMQ ----
  rabbitmq-username: "eshop_user"
  rabbitmq-password: "eshop_rmq_pass_2024"

  # ---- JWT ----
  jwt-secret-key: "your-super-secret-jwt-key-at-least-32-chars!!"
  jwt-issuer: "EShop"
  jwt-audience: "EShop"

  # ---- Internal service API key ----
  internal-service-api-key: "LOCAL_internal_service_api_key"
  internal-service-api-key-header: "X-Internal-Api-Key"

  # ---- Seq ----
  seq-admin-password: "qweasdz1"
